<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En Passant — Board</title>
  <link rel="icon" href="Logo.png" type="image/png">
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --gold-dim: #7a6030;
      --gold-dark: #3a2a08;
      --sq-gold: #c9a84c;
      --sq-black: #3c2e15;
      --bg: #0a0a0a;
      --text: #e8dcc8;
      --text-dim: #7a7060;
      --border: rgba(201, 168, 76, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;
    }

    /* ── Cursor ── */
    .cursor {
      width: 10px;
      height: 10px;
      background: var(--gold);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }

    /* ── Grain overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.35;
    }

    /* ── Ambient background glow ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(201, 168, 76, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Page layout ── */
    .game-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      z-index: 1;
      animation: fadeIn 0.8s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Board container ── */
    .board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Rank/file labels ── */
    .board-row {
      display: flex;
      align-items: center;
    }

    .rank-label {
      width: 24px;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      user-select: none;
      flex-shrink: 0;
    }

    .file-labels {
      display: flex;
      padding-left: 24px;
      padding-right: 24px;
      margin-top: 6px;
    }

    .file-label {
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      user-select: none;
    }

    /* ── The board itself ── */
    .board-frame {
      padding: 10px;
      background: linear-gradient(135deg, #2a1f08, #0f0c04, #2a1f08);
      border: 1px solid var(--gold-dim);
      box-shadow:
        0 0 0 1px rgba(201, 168, 76, 0.08),
        0 0 40px rgba(201, 168, 76, 0.12),
        0 0 100px rgba(201, 168, 76, 0.06),
        inset 0 0 20px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* Corner ornaments on the frame */
    .board-frame::before,
    .board-frame::after {
      content: '✦';
      position: absolute;
      color: var(--gold-dim);
      font-size: 0.6rem;
      opacity: 0.6;
    }

    .board-frame::before {
      top: 3px;
      left: 5px;
    }

    .board-frame::after {
      bottom: 3px;
      right: 5px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: min(72vmin, 560px);
      height: min(72vmin, 560px);
      border: 1px solid rgba(201, 168, 76, 0.2);
      overflow: hidden;
    }

    /* ── Squares ── */
    .sq {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.15s;
    }

    /* Gold squares */
    .sq.light {
      background-color: var(--sq-gold);
      background-image:
        radial-gradient(ellipse at 30% 30%, rgba(255, 235, 160, 0.25) 0%, transparent 60%),
        linear-gradient(135deg, rgba(255, 240, 180, 0.1) 0%, transparent 50%);
    }

    /* Black squares */
    .sq.dark {
      background-color: var(--sq-black);
      background-image:
        radial-gradient(ellipse at 70% 70%, rgba(201, 168, 76, 0.04) 0%, transparent 60%);
    }

    /* Hover highlight */
    .sq:hover {
      filter: brightness(1.25);
      cursor: none;
    }

    /* Selected square */
    .sq.selected {
      box-shadow: inset 0 0 0 3px rgba(240, 208, 128, 0.9);
      filter: brightness(1.15);
    }

    /* Legal move dot */
    .sq.legal::after {
      content: '';
      position: absolute;
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: rgba(240, 208, 128, 0.45);
      pointer-events: none;
    }

    /* Legal move on occupied square — ring instead */
    .sq.legal-capture::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 0;
      box-shadow: inset 0 0 0 4px rgba(87, 2, 2, 0.979);
      pointer-events: none;
    }

    /* Last move highlight */
    .sq.last-move {
      background-image:
        radial-gradient(circle at center, rgba(117, 108, 194, 0.245) 90%, transparent 100%);
    }

    /* Check highlight */
    .sq.in-check {
      box-shadow: inset 0 0 0 3px rgba(220, 60, 60, 0.8);
    }

    /* ── Coordinate overlays inside squares ── */
    .sq-coord {
      position: absolute;
      font-size: clamp(7px, 1.1vmin, 10px);
      font-family: 'Cinzel', serif;
      font-weight: 600;
      line-height: 1;
      pointer-events: none;
      opacity: 0.55;
      user-select: none;
    }

    .sq-coord.file {
      bottom: 2px;
      right: 4px;
    }

    .sq-coord.rank {
      top: 2px;
      left: 4px;
    }

    /* coord color flips with square color */
    .sq.light .sq-coord {
      color: var(--sq-black);
    }

    .sq.dark .sq-coord {
      color: var(--sq-gold);
    }

    /* ── Side panel ── */
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 200px;
    }

    .panel-block {
      border: 1px solid var(--border);
      padding: 1rem 1.2rem;
      background: rgba(201, 168, 76, 0.03);
      position: relative;
    }

    .panel-block::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 30px;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
    }

    .panel-label {
      font-size: 0.55rem;
      letter-spacing: 0.5em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .panel-value {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--gold);
    }

    /* Turn indicator */
    .turn-indicator {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .turn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .turn-dot.white-turn {
      background: var(--gold-light);
      box-shadow: 0 0 8px rgba(240, 208, 128, 0.8);
    }

    .turn-dot.black-turn {
      background: #111;
      border: 1px solid var(--gold-dim);
      box-shadow: none;
    }

    /* Move history */
    .move-history {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      line-height: 1.8;
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-dim) transparent;
    }

    .move-history::-webkit-scrollbar {
      width: 3px;
    }

    .move-history::-webkit-scrollbar-thumb {
      background: var(--gold-dim);
    }

    .move-pair {
      display: flex;
      gap: 0.5rem;
      padding: 0.1rem 0;
    }

    .move-num {
      color: var(--gold-dim);
      min-width: 20px;
    }

    .move-w {
      color: var(--text);
      min-width: 45px;
    }

    .move-b {
      color: var(--text-dim);
    }

    /* Action buttons */
    .action-btn {
      display: block;
      width: 100%;
      padding: 0.7rem 1rem;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid var(--gold-dim);
      color: var(--text-dim);
      background: transparent;
      cursor: none;
      transition: color 0.25s, border-color 0.25s, background 0.25s;
      position: relative;
      overflow: hidden;
    }

    .action-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-101%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: -1;
    }

    .action-btn:hover::before {
      transform: translateX(0);
    }

    .action-btn:hover {
      color: var(--bg);
      border-color: var(--gold);
    }

    /* Header bar */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      z-index: 100;
      border-bottom: 1px solid rgba(201, 168, 76, 0.08);
      background: linear-gradient(to bottom, rgba(10, 10, 10, 0.95), transparent);
    }

    .header-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(201, 168, 76, 0.3);
    }

    .header-mode {
      font-size: 0.6rem;
      letter-spacing: 0.5em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .header-back {
      font-size: 0.6rem;
      letter-spacing: 0.4em;
      color: var(--text-dim);
      text-decoration: none;
      text-transform: uppercase;
      cursor: none;
      transition: color 0.2s;
    }

    .header-back:hover {
      color: var(--gold);
    }

    /* ════════════════════════════════════════════════════════
       Additions: banner, navigation, move list, evaluation bar,
       resign, game-over king highlights, promotion picker
       ════════════════════════════════════════════════════════ */

    button,
    label,
    input,
    .mv {
      cursor: none;
    }

    .side-panel {
      gap: 1.1rem;
    }

    /* ── Server status banner ── */
    .banner {
      position: fixed;
      top: 4.4rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      max-width: min(620px, 92vw);
      padding: 0.8rem 1.2rem;
      border: 1px solid var(--gold-dim);
      background: rgba(20, 15, 4, 0.96);
      box-shadow: 0 0 30px rgba(201, 168, 76, 0.18);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      line-height: 1.6;
      color: var(--text);
    }

    .banner[hidden] {
      display: none;
    }

    .banner.error {
      border-color: rgba(220, 80, 80, 0.7);
      box-shadow: 0 0 30px rgba(220, 60, 60, 0.18);
    }

    .banner-spinner {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border: 2px solid var(--gold-dim);
      border-top-color: var(--gold-light);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .banner.error .banner-spinner {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .banner button {
      flex-shrink: 0;
      padding: 0.35rem 0.8rem;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--gold-dim);
    }

    .banner button:hover {
      background: var(--gold);
      color: var(--bg);
    }

    /* ── Move list ── */
    .moves-block .move-history {
      max-height: 130px;
      font-size: 0.7rem;
    }

    .mv {
      padding: 0 0.25rem;
      min-width: 45px;
      color: var(--text-dim);
      transition: color 0.15s, background 0.15s;
    }

    .mv.white-mv {
      color: var(--text);
    }

    .mv:hover {
      color: var(--gold-light);
    }

    .mv.current {
      background: var(--gold);
      color: var(--bg);
    }

    .moves-empty {
      color: var(--gold-dim);
    }

    /* ── Back / forward buttons ── */
    .nav-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
    }

    .nav-btn {
      padding: 0.55rem 0;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      line-height: 1;
      color: var(--gold);
      background: transparent;
      border: 1px solid var(--gold-dim);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--gold);
      color: var(--bg);
    }

    .nav-btn:disabled {
      opacity: 0.25;
    }

    .nav-hint {
      margin-top: 0.6rem;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
    }

    /* ── Toggle switch ── */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }

    .switch-row .panel-label {
      margin-bottom: 0;
    }

    .switch {
      position: relative;
      width: 42px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      z-index: 2;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border: 1px solid var(--gold-dim);
      background: rgba(0, 0, 0, 0.5);
      transition: background 0.25s, border-color 0.25s;
    }

    .switch-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      background: var(--gold-dim);
      transition: transform 0.25s, background 0.25s;
    }

    .switch input:checked+.switch-track {
      background: rgba(201, 168, 76, 0.25);
      border-color: var(--gold);
    }

    .switch input:checked+.switch-track::after {
      transform: translateX(20px);
      background: var(--gold-light);
    }

    .switch input:focus-visible+.switch-track {
      outline: 1px solid var(--gold-light);
      outline-offset: 2px;
    }

    /* ── Evaluation bar (sits in the gap to the left of the board) ── */
    .eval-bar {
      position: absolute;
      right: calc(100% + 10px);
      top: 0;
      bottom: 0;
      width: 20px;
      display: flex;
      flex-direction: column-reverse;
      overflow: hidden;
      border: 1px solid var(--gold-dim);
      background: #1a1408;
      box-shadow: 0 0 14px rgba(201, 168, 76, 0.12);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .eval-bar.on {
      opacity: 1;
      visibility: visible;
    }

    .eval-bar.flipped {
      flex-direction: column;
    }

    .eval-white {
      height: 50%;
      background: linear-gradient(to right, #f6ecd0, #e2cf98);
      transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .eval-label {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0;
      pointer-events: none;
      transition: color 0.3s;
    }

    .eval-label.top {
      top: 3px;
    }

    .eval-label.bottom {
      bottom: 3px;
    }

    .eval-label.on-white {
      color: #2a1f08;
    }

    .eval-label.on-black {
      color: var(--gold-light);
    }

    .eval-pending {
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.55;
      }
    }

    /* ── Resign button ── */
    .action-btn.danger {
      border-color: rgba(190, 70, 70, 0.6);
    }

    .action-btn.danger::before {
      background: #a83232;
    }

    .action-btn.danger:hover {
      color: #fff;
      border-color: #a83232;
    }

    .action-btn.armed {
      color: #fff;
      border-color: #d05050;
      background: #8f1d1d;
    }

    .action-btn.disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    /* ── Viewing an earlier position ── */
    .board-frame.viewing {
      border-color: rgba(120, 150, 210, 0.7);
      box-shadow:
        0 0 0 1px rgba(120, 150, 210, 0.15),
        0 0 40px rgba(120, 150, 210, 0.18),
        inset 0 0 20px rgba(0, 0, 0, 0.6);
    }

    /* ── Game-over king highlights ── */
    .sq.king-lose {
      background-color: #8f1d1d !important;
      background-image: none !important;
      box-shadow: inset 0 0 0 3px #ff6b6b, 0 0 22px rgba(255, 70, 70, 0.55);
      z-index: 5;
    }

    .sq.king-win {
      background-color: #1d6b3a !important;
      background-image: none !important;
      box-shadow: inset 0 0 0 3px #62e58f, 0 0 22px rgba(80, 225, 130, 0.5);
      z-index: 5;
    }

    .sq.king-draw {
      background-color: #5b6577 !important;
      background-image: none !important;
      box-shadow: inset 0 0 0 3px #b4bfd0, 0 0 18px rgba(170, 185, 210, 0.4);
      z-index: 5;
    }

    .half-badge {
      position: absolute;
      top: 3px;
      right: 5px;
      z-index: 20;
      font-family: 'Cinzel', serif;
      font-size: clamp(10px, 1.9vmin, 17px);
      font-weight: 700;
      line-height: 1;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .piece.fallen {
      animation: topple 0.8s cubic-bezier(0.5, 0, 0.3, 1.25) both;
    }

    @keyframes topple {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(90deg);
      }
    }

    /* ── Promotion picker ── */
    .promo {
      position: absolute;
      inset: 10px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 4, 2, 0.72);
    }

    .promo[hidden] {
      display: none;
    }

    .promo-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      padding: 1.1rem 1.3rem;
      border: 1px solid var(--gold-dim);
      background: #140f04;
      box-shadow: 0 0 40px rgba(201, 168, 76, 0.25);
    }

    .promo-title {
      font-size: 0.6rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .promo-row {
      display: flex;
      gap: 0.6rem;
    }

    .promo-row button {
      width: clamp(52px, 9vmin, 76px);
      height: clamp(52px, 9vmin, 76px);
      padding: 4px;
      background: var(--sq-gold);
      border: 1px solid var(--gold-dim);
      transition: filter 0.15s, transform 0.15s;
    }

    .promo-row button:hover {
      filter: brightness(1.2);
      transform: translateY(-2px);
    }

    .promo-row img {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* ════════════════════════════════════════════════════════
       Touch screens and phones
       ════════════════════════════════════════════════════════ */

    body {
      -webkit-tap-highlight-color: transparent;
    }

    .board {
      touch-action: manipulation;
      /* no double-tap zoom on the board */
      -webkit-user-select: none;
      user-select: none;
    }

    /* Touch devices have no pointer to follow: drop the custom cursor and hover effects */
    @media (hover: none),
    (pointer: coarse) {
      .cursor {
        display: none;
      }

      body,
      a,
      button,
      label,
      input,
      .sq,
      .sq:hover,
      .mv,
      .action-btn,
      .header-back {
        cursor: auto;
      }

      .sq:hover {
        filter: none;
      }

      .nav-hint {
        display: none;
      }
    }

    /* Narrow screens: board on top, controls in a grid underneath */
    @media (max-width: 900px) {
      body {
        overflow-x: hidden;
        overflow-y: auto;
        justify-content: flex-start;
        padding: 3.9rem 12px 1.5rem;
      }

      .header {
        padding: 0.8rem 1rem;
        gap: 0.6rem;
        background: rgba(10, 10, 10, 0.96);
      }

      .header-title {
        font-size: 0.85rem;
        letter-spacing: 0.15em;
        white-space: nowrap;
      }

      .header-back,
      .header-mode {
        font-size: 0.5rem;
        letter-spacing: 0.18em;
      }

      .header-back {
        white-space: nowrap;
      }

      .header-mode {
        max-width: 34%;
        text-align: right;
        line-height: 1.5;
      }

      .banner {
        top: 3.6rem;
        padding: 0.7rem 0.9rem;
        font-size: 0.62rem;
      }

      .game-wrapper {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 0.6rem;
        width: 100%;
        max-width: 600px;
      }

      /* Let the blocks of both side panels take part in the grid directly */
      .side-panel {
        display: contents;
      }

      .board-container {
        grid-column: 1 / -1;
        order: 0;
        justify-self: center;
        padding-left: 22px;
        /* room for the evaluation bar */
        margin-bottom: 0.3rem;
      }

      .board-frame {
        padding: 6px;
      }

      .board {
        width: min(calc(100vw - 64px), calc(100vh - 7rem), 560px);
        height: min(calc(100vw - 64px), calc(100vh - 7rem), 560px);
      }

      .file-labels {
        display: none;
      }

      .eval-bar {
        right: calc(100% + 6px);
        width: 16px;
      }

      .eval-label {
        font-size: 0.45rem;
      }

      .promo {
        inset: 6px;
      }

      .panel-block {
        padding: 0.6rem 0.8rem;
      }

      .panel-label {
        margin-bottom: 0.35rem;
        letter-spacing: 0.3em;
      }

      .panel-value {
        font-size: 0.85rem;
      }

      /* Row 1: turn and status */
      .blk-turn {
        grid-column: span 3;
        order: 1;
      }

      .blk-status {
        grid-column: span 3;
        order: 2;
      }

      /* Row 2: resign, new game, flip */
      #btn-resign,
      #btn-new,
      #btn-flip {
        grid-column: span 2;
        order: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.5rem 0.3rem;
        font-size: 0.58rem;
        letter-spacing: 0.15em;
        line-height: 1.4;
      }

      /* Row 3: review buttons and the evaluation switch */
      .blk-review {
        grid-column: span 4;
        order: 4;
      }

      .blk-eval {
        grid-column: span 2;
        order: 5;
      }

      .blk-eval .panel-label {
        letter-spacing: 0.15em;
      }

      .nav-hint {
        display: none;
      }

      .blk-eval .switch-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }

      .nav-btn {
        min-height: 40px;
        font-size: 1.1rem;
      }

      /* Row 4: move list and move number */
      .moves-block {
        grid-column: span 4;
        order: 6;
      }

      .blk-move {
        grid-column: span 2;
        order: 7;
      }

      .moves-block .move-history {
        max-height: 110px;
      }

      /* The captured-pieces panels are not filled in yet; save the space on small screens */
      .blk-captured {
        display: none;
      }
    }

    @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {

      /* Phone on its side: board on the left, controls beside it */
      .board {
        width: min(calc(100vh - 5.5rem), 560px);
        height: min(calc(100vh - 5.5rem), 560px);
      }

      .game-wrapper {
        grid-template-columns: auto repeat(6, minmax(0, 1fr));
        max-width: none;
        align-items: start;
      }

      .board-container {
        grid-column: 1;
        grid-row: 1 / span 6;
        align-self: start;
        margin-bottom: 0;
        margin-right: 0.4rem;
      }

      .moves-block .move-history {
        max-height: 70px;
      }
    }
  </style>
</head>

<body>

  <div class="cursor" id="cursor"></div>

  <!-- ── Header ── -->
  <header class="header">
    <a href="EnPassant.html" class="header-back">← Menu</a>
    <div class="header-title">En Passant</div>
    <div class="header-mode" id="header-mode">Player vs Player</div>
  </header>

  <!-- ── Server / error banner ── -->
  <div class="banner" id="banner" role="status" aria-live="polite" hidden>
    <div class="banner-spinner"></div>
    <div id="banner-text"></div>
    <button type="button" id="banner-btn" hidden>Retry</button>
  </div>

  <!-- ── Game layout ── -->
  <div class="game-wrapper">

    <!-- Left panel -->
    <div class="side-panel left-panel">

      <div class="panel-block blk-turn">
        <div class="panel-label">Turn</div>
        <div class="turn-indicator">
          <div class="turn-dot white-turn" id="turn-dot"></div>
          <div class="panel-value" id="turn-text">White</div>
        </div>
      </div>

      <div class="panel-block blk-move">
        <div class="panel-label">Move</div>
        <div class="panel-value" id="move-count">1</div>
      </div>

      <div class="panel-block moves-block">
        <div class="panel-label">Moves</div>
        <div class="move-history" id="move-list"></div>
      </div>

      <div class="panel-block blk-review">
        <div class="panel-label">Review</div>
        <div class="nav-row">
          <button type="button" class="nav-btn" id="nav-first" title="First position" aria-label="First position">«</button>
          <button type="button" class="nav-btn" id="nav-prev" title="Back one move" aria-label="Back one move">‹</button>
          <button type="button" class="nav-btn" id="nav-next" title="Forward one move" aria-label="Forward one move">›</button>
          <button type="button" class="nav-btn" id="nav-last" title="Back to the current position"
            aria-label="Back to the current position">»</button>
        </div>
        <div class="nav-hint">Arrow keys work too</div>
      </div>

      <div class="panel-block blk-eval">
        <div class="switch-row">
          <div class="panel-label">Evaluation</div>
          <label class="switch" title="Show the engine evaluation bar">
            <input type="checkbox" id="eval-toggle" aria-label="Show the engine evaluation bar">
            <span class="switch-track"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Board -->
    <div class="board-container">
      <div class="board-frame" id="board-frame">
        <div class="eval-bar" id="eval-bar" aria-hidden="true">
          <div class="eval-white" id="eval-white"></div>
          <span class="eval-label" id="eval-label"></span>
        </div>
        <div class="board" id="board"></div>

        <div class="promo" id="promo" hidden>
          <div class="promo-box">
            <div class="promo-title">Promote to</div>
            <div class="promo-row" id="promo-row"></div>
          </div>
        </div>
      </div>

      <!-- File labels below board -->
      <div class="file-labels" id="file-labels"></div>
    </div>

    <!-- Right panel -->
    <div class="side-panel right-panel">

      <div class="panel-block blk-captured">
        <div class="panel-label">Captured — White</div>
        <div class="panel-value" id="captured-white" style="font-size:1.1rem;letter-spacing:0.05em;">—</div>
      </div>

      <div class="panel-block blk-captured">
        <div class="panel-label">Captured — Black</div>
        <div class="panel-value" id="captured-black" style="font-size:1.1rem;letter-spacing:0.05em;">—</div>
      </div>

      <div class="panel-block blk-status">
        <div class="panel-label">Status</div>
        <div class="panel-value" id="game-status" style="font-size:0.8rem;letter-spacing:0.05em;color:var(--text);">In
          Progress</div>
      </div>

      <a href="#" class="action-btn danger" id="btn-resign">Resign</a>
      <a href="#" class="action-btn" id="btn-new">New Game</a>
      <a href="#" class="action-btn" id="btn-flip">Flip Board</a>

    </div>

  </div>

  <script>
    // ════════════════════════════════════════════════════════
    //  Setup
    // ════════════════════════════════════════════════════════
    const $ = id => document.getElementById(id);

    const urlParams = new URLSearchParams(window.location.search);
    const gameMode = urlParams.get('mode') === 'pvp' ? 'pvp' : 'cpu'; // default to the computer
    const playerColorPref = (urlParams.get('color') || 'white').toLowerCase() === 'black' ? 'black' : 'white';
    const humanColorName = playerColorPref === 'white' ? 'White' : 'Black';

    // The game server: a local one while developing, the hosted one otherwise.
    const IS_LOCAL = ['localhost', '127.0.0.1', '[::1]', ''].includes(window.location.hostname);
    const PROD_API = 'https://chess-engine-api-1zm6.onrender.com';
    const API_BASE = IS_LOCAL ? (urlParams.get('api') || 'http://localhost:8080') : PROD_API;

    const WAKE_MESSAGE = 'Waking up the game server… It runs on a free plan that sleeps when idle, ' +
      'so this can take 30–60 seconds. Thanks for waiting!';

    let headerText = gameMode === 'pvp' ? 'Player vs Player' : 'vs Computer';
    if (gameMode === 'cpu') headerText += ` (${humanColorName})`;
    $('header-mode').textContent = headerText;

    // ── Cursor ── (a touch screen has no pointer to follow, so the dot is hidden on the first touch)
    const cursor = $('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
    window.addEventListener('touchstart', () => { cursor.style.display = 'none'; }, { once: true, passive: true });

    function store(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ } }
    function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    // ════════════════════════════════════════════════════════
    //  Game state
    //  moves[i]  is the move that leads from position i to position i + 1
    //  fens[i]   is position i (position 0 is the start)
    //  evals[i]  is the engine score of position i, or null while unknown
    //  view      is the position being shown; the live position is moves.length
    // ════════════════════════════════════════════════════════
    const FILES = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const START_PLACEMENT = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';

    const game = {
      moves: [],
      fens: [START_PLACEMENT],
      evals: [{ cp: 0 }],
      view: 0,
      legal: [],        // legal moves of the live position, e.g. "e2e4" or "e7e8q"
      turn: 'White',    // side to move in the live position
      result: null,     // null while playing, else { type, loser }
      busy: false,      // waiting for the server
      epoch: 0          // bumped on every new game so late replies can be ignored
    };

    let flipped = playerColorPref === 'black';
    let selectedSquare = null;
    let evalOn = recall('evalOn') === '1';
    let evalInflight = false;
    let resignArmed = false;
    let resignTimer = null;

    const isLive = () => game.view === game.moves.length;

    // ════════════════════════════════════════════════════════
    //  Server communication
    // ════════════════════════════════════════════════════════
    class ApiError extends Error {
      constructor(message, retryable) { super(message); this.retryable = retryable; }
    }

    let bannerRetry = null;
    function showBanner(text, { error = false, retry = null } = {}) {
      $('banner-text').textContent = text;
      $('banner').classList.toggle('error', error);
      $('banner-btn').hidden = !retry;
      bannerRetry = retry;
      $('banner').hidden = false;
    }
    function hideBanner() { $('banner').hidden = true; bannerRetry = null; }
    $('banner-btn').addEventListener('click', () => {
      const retry = bannerRetry;
      hideBanner();
      if (retry) retry();
    });

    function parseEval(text) {
      if (!text) return null;
      if (text[0] === '#') return { mate: parseInt(text.slice(1), 10) };
      return { cp: parseInt(text, 10) };
    }

    // Reply: FEN | CPU_MOVE | LEGAL_MOVES | TURN | EVAL | STATUS | FEN_BEFORE_CPU
    function parseResponse(text) {
      const p = text.split('|');
      if (p.length < 6) throw new ApiError('The server sent a reply this page does not understand.', false);
      return {
        fen: p[0],
        cpuMove: p[1],
        legal: p[2] ? p[2].split(',') : [],
        turn: p[3],
        eval: parseEval(p[4]),
        status: p[5],
        fenBeforeCpu: p[6] || ''
      };
    }

    // Sends the whole game to the server. The server keeps no game state, so a request can be
    // repeated safely, which is what lets us wait out a sleeping host.
    async function api(mode, moves, { quiet = false, patience = 120000 } = {}) {
      const payload = `${mode}|${moves.join(' ')}|${playerColorPref.toUpperCase()}`;
      const giveUpAt = Date.now() + patience;
      let wakingShown = false;
      const wakeTimer = quiet ? null : setTimeout(() => { wakingShown = true; showBanner(WAKE_MESSAGE); }, 4000);
      try {
        for (; ;) {
          try {
            const controller = new AbortController();
            const abortTimer = setTimeout(() => controller.abort(), 90000);
            let response;
            try {
              response = await fetch(`${API_BASE}/api/move`, { method: 'POST', body: payload, signal: controller.signal });
            } finally {
              clearTimeout(abortTimer);
            }
            const text = await response.text();
            if (response.status === 400) throw new ApiError(text.replace(/^ERROR\|/, ''), false);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return parseResponse(text);
          } catch (err) {
            if (err instanceof ApiError && !err.retryable) throw err;
            if (Date.now() > giveUpAt) {
              throw new ApiError('Could not reach the game server. Please check your connection and try again.', true);
            }
            await sleep(3000);
          }
        }
      } finally {
        clearTimeout(wakeTimer);
        if (wakingShown) hideBanner();
      }
    }

    // ════════════════════════════════════════════════════════
    //  Board drawing
    // ════════════════════════════════════════════════════════
    function buildBoard() {
      const board = $('board');
      board.innerHTML = '';

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const displayRow = flipped ? 7 - row : row;
          const displayCol = flipped ? 7 - col : col;

          const rank = 8 - displayRow;           // 8 down to 1
          const file = FILES[displayCol];        // a–h

          const isLight = (displayRow + displayCol) % 2 !== 0;
          const sq = document.createElement('div');
          sq.className = `sq ${isLight ? 'dark' : 'light'}`;
          sq.dataset.rank = rank;
          sq.dataset.file = file;
          sq.dataset.sq = `${file}${rank}`;

          // Show rank label on leftmost column
          if (col === 0) {
            const coord = document.createElement('span');
            coord.className = 'sq-coord rank';
            coord.textContent = rank;
            sq.appendChild(coord);
          }

          // Show file label on bottom row
          if (row === 7) {
            const coord = document.createElement('span');
            coord.className = 'sq-coord file';
            coord.textContent = file;
            sq.appendChild(coord);
          }

          board.appendChild(sq);
        }
      }
    }

    // Using the classic "Alpha" SVG set
    const PIECE_IMAGES = {
      'K': 'assets/wK.svg', 'Q': 'assets/wQ.svg', 'R': 'assets/wR.svg',
      'B': 'assets/wB.svg', 'N': 'assets/wN.svg', 'P': 'assets/wP.svg',
      'k': 'assets/bK.svg', 'q': 'assets/bQ.svg', 'r': 'assets/bR.svg',
      'b': 'assets/bB.svg', 'n': 'assets/bN.svg', 'p': 'assets/bP.svg'
    };

    function loadFEN(fenString) {
      document.querySelectorAll('.piece').forEach(p => p.remove());

      const rows = fenString.split(' ')[0].split('/');
      for (let r = 0; r < 8; r++) {
        let fileIndex = 0;
        for (let i = 0; i < rows[r].length; i++) {
          const char = rows[r][i];
          if (!isNaN(char)) {
            fileIndex += parseInt(char, 10);
          } else {
            placePiece(`${FILES[fileIndex]}${8 - r}`, char);
            fileIndex++;
          }
        }
      }
    }

    function placePiece(squareId, pieceChar) {
      const squareEl = document.querySelector(`.sq[data-sq="${squareId}"]`);
      if (!squareEl) return;

      const imgEl = document.createElement('img');
      imgEl.src = PIECE_IMAGES[pieceChar];
      imgEl.alt = '';
      imgEl.className = 'piece';
      imgEl.dataset.piece = pieceChar;

      imgEl.style.width = '95%';
      imgEl.style.height = '95%';
      imgEl.style.position = 'absolute';
      imgEl.style.pointerEvents = 'none'; // Clicks pass through to the square
      imgEl.style.userSelect = 'none';
      imgEl.style.zIndex = '10';

      if (pieceChar === pieceChar.toUpperCase()) {
        // White pieces get a bright, warm gold glow
        imgEl.style.filter = 'drop-shadow(0px 4px 6px rgba(240,208,128,0.4))';
      } else {
        // Black pieces get a heavy dark shadow with a subtle ambient gold rim light
        imgEl.style.filter = 'drop-shadow(0px 4px 6px rgba(0,0,0,0.8)) drop-shadow(0px 0px 8px rgba(201,168,76,0.15))';
      }

      squareEl.appendChild(imgEl);
    }

    const squareEl = id => document.querySelector(`.sq[data-sq="${id}"]`);

    function findKing(fen, pieceChar) {
      const rows = fen.split(' ')[0].split('/');
      for (let r = 0; r < 8; r++) {
        let file = 0;
        for (const ch of rows[r]) {
          if (!isNaN(ch)) { file += parseInt(ch, 10); continue; }
          if (ch === pieceChar) return `${FILES[file]}${8 - r}`;
          file++;
        }
      }
      return null;
    }

    // Winner green, loser red with the king knocked over; draws get a neutral colour and a ½ badge.
    function paintResult() {
      const fen = game.fens[game.view];
      const whiteKing = findKing(fen, 'K');
      const blackKing = findKing(fen, 'k');
      const { loser } = game.result;

      const paint = (sqId, cls, topple, badge) => {
        const el = sqId && squareEl(sqId);
        if (!el) return;
        el.classList.add(cls);
        if (topple) el.querySelector('.piece')?.classList.add('fallen');
        if (badge) {
          const b = document.createElement('span');
          b.className = 'half-badge';
          b.textContent = '½';
          el.appendChild(b);
        }
      };

      if (loser) {
        paint(loser === 'White' ? whiteKing : blackKing, 'king-lose', true, false);
        paint(loser === 'White' ? blackKing : whiteKing, 'king-win', false, false);
      } else {
        paint(whiteKing, 'king-draw', false, true);
        paint(blackKing, 'king-draw', false, true);
      }
    }

    function render() {
      selectedSquare = null;
      buildBoard();
      loadFEN(game.fens[game.view]);

      if (game.view > 0) {
        const last = game.moves[game.view - 1];
        squareEl(last.substring(0, 2))?.classList.add('last-move');
        squareEl(last.substring(2, 4))?.classList.add('last-move');
      }
      if (isLive() && game.result) paintResult();

      $('board-frame').classList.toggle('viewing', !isLive());
      updatePanels();
      updateMoveList();
      updateNav();
      updateEvalBar();
      updateResignButton();
      maybeFetchEval();
    }

    // ════════════════════════════════════════════════════════
    //  Side panels
    // ════════════════════════════════════════════════════════
    function resultText() {
      const { type, loser } = game.result;
      const winner = loser === 'White' ? 'Black' : 'White';
      switch (type) {
        case 'CHECKMATE': return `Checkmate — ${winner} wins`;
        case 'RESIGN': return `${loser} resigned — ${winner} wins`;
        case 'STALEMATE': return 'Stalemate — draw';
        case 'DRAW_REPETITION': return 'Draw by threefold repetition';
        case 'DRAW_50': return 'Draw by the 50-move rule';
        default: return 'Game over';
      }
    }

    function updatePanels() {
      const live = isLive();
      const viewTurn = game.view % 2 === 0 ? 'White' : 'Black';
      const dot = $('turn-dot');
      const turnText = $('turn-text');

      if (live && game.result) {
        turnText.textContent = 'Game over';
        dot.style.display = 'none';
      } else if (live && game.busy && gameMode === 'cpu' && game.legal.length > 0) {
        turnText.textContent = 'Engine running...';
        dot.style.display = 'inline-block';
        dot.className = 'turn-dot black-turn';
      } else {
        turnText.textContent = viewTurn;
        dot.style.display = 'inline-block';
        dot.className = viewTurn === 'White' ? 'turn-dot white-turn' : 'turn-dot black-turn';
      }

      $('move-count').textContent = Math.floor(game.view / 2) + 1;

      const status = $('game-status');
      if (!live) {
        status.textContent = `Viewing move ${game.view} of ${game.moves.length}`;
        status.style.color = '#8fa8de';
      } else if (game.result) {
        status.textContent = resultText();
        status.style.color = game.result.loser ? 'var(--gold)' : '#b4bfd0';
      } else if (game.busy && game.legal.length === 0) {
        status.textContent = 'Connecting…';
        status.style.color = 'var(--text-dim)';
      } else {
        status.textContent = 'In Progress';
        status.style.color = 'var(--text)';
      }
    }

    function updateMoveList() {
      const list = $('move-list');
      list.innerHTML = '';
      if (game.moves.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'moves-empty';
        empty.textContent = '—';
        list.appendChild(empty);
        return;
      }

      let current = null;
      for (let i = 0; i < game.moves.length; i += 2) {
        const pair = document.createElement('div');
        pair.className = 'move-pair';

        const num = document.createElement('span');
        num.className = 'move-num';
        num.textContent = `${i / 2 + 1}.`;
        pair.appendChild(num);

        for (let j = i; j < Math.min(i + 2, game.moves.length); j++) {
          const mv = document.createElement('span');
          mv.className = 'mv' + (j % 2 === 0 ? ' white-mv' : '');
          mv.dataset.ply = j + 1;
          mv.textContent = game.moves[j];
          if (j + 1 === game.view) { mv.classList.add('current'); current = mv; }
          pair.appendChild(mv);
        }
        list.appendChild(pair);
      }
      if (current) current.scrollIntoView({ block: 'nearest' });
      else if (isLive()) list.scrollTop = list.scrollHeight;
    }

    $('move-list').addEventListener('click', e => {
      const mv = e.target.closest('.mv');
      if (mv) goTo(parseInt(mv.dataset.ply, 10));
    });

    // ════════════════════════════════════════════════════════
    //  Back / forward
    // ════════════════════════════════════════════════════════
    function goTo(position) {
      if (game.busy) return;
      const target = Math.max(0, Math.min(position, game.moves.length));
      if (target === game.view) return;
      game.view = target;
      closePromotion();
      render();
    }

    function updateNav() {
      const atStart = game.view === 0;
      const atEnd = isLive();
      $('nav-first').disabled = game.busy || atStart;
      $('nav-prev').disabled = game.busy || atStart;
      $('nav-next').disabled = game.busy || atEnd;
      $('nav-last').disabled = game.busy || atEnd;
    }

    $('nav-first').addEventListener('click', () => goTo(0));
    $('nav-prev').addEventListener('click', () => goTo(game.view - 1));
    $('nav-next').addEventListener('click', () => goTo(game.view + 1));
    $('nav-last').addEventListener('click', () => goTo(game.moves.length));

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closePromotion(); clearSelection(); return; }
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === 'ArrowLeft') goTo(game.view - 1);
      else if (e.key === 'ArrowRight') goTo(game.view + 1);
      else if (e.key === 'Home') goTo(0);
      else if (e.key === 'End') goTo(game.moves.length);
      else return;
      e.preventDefault();
    });

    // ════════════════════════════════════════════════════════
    //  Evaluation bar
    // ════════════════════════════════════════════════════════
    function evalForDisplay() {
      if (isLive() && game.result) {
        if (game.result.loser) {
          return game.result.loser === 'White' ? { fill: 0, label: '0-1' } : { fill: 1, label: '1-0' };
        }
        return { fill: 0.5, label: '½' };
      }
      const e = game.evals[game.view];
      if (!e) return { fill: 0.5, label: '…', pending: true };
      if (e.unknown) return { fill: 0.5, label: '–' };
      if (e.mate !== undefined) return { fill: e.mate > 0 ? 1 : 0, label: 'M' + Math.abs(e.mate) };
      const fill = 1 / (1 + Math.exp(-0.0035 * e.cp));
      const pawns = Math.abs(e.cp) / 100;
      return { fill, label: pawns >= 10 ? String(Math.round(pawns)) : pawns.toFixed(1) };
    }

    function updateEvalBar() {
      const bar = $('eval-bar');
      bar.classList.toggle('on', evalOn);
      bar.classList.toggle('flipped', flipped);
      if (!evalOn) return;

      const d = evalForDisplay();
      $('eval-white').style.height = (d.fill * 100) + '%';

      // Show the number at the end of whichever side is ahead
      const whiteAhead = d.fill >= 0.5;
      const atBottom = whiteAhead ? !flipped : flipped;
      const label = $('eval-label');
      label.textContent = d.label;
      label.className = 'eval-label ' + (atBottom ? 'bottom' : 'top') + ' ' +
        (whiteAhead ? 'on-white' : 'on-black') + (d.pending ? ' eval-pending' : '');
    }

    // Positions the engine has not scored yet (PvP games, or moves played while the bar was off)
    // are scored on demand, one request at a time.
    function maybeFetchEval() {
      if (!evalOn || evalInflight || game.busy) return;
      const e = game.evals[game.view];
      if (e !== null && e !== undefined) return;
      if (isLive() && game.result) return;
      fetchEval(game.view);
    }

    async function fetchEval(position) {
      evalInflight = true;
      const epoch = game.epoch;
      try {
        const r = await api('EVAL', game.moves.slice(0, position), { quiet: true, patience: 15000 });
        if (epoch === game.epoch) game.evals[position] = r.eval || { unknown: true };
      } catch (err) {
        if (epoch === game.epoch) game.evals[position] = { unknown: true };
      } finally {
        evalInflight = false;
        if (epoch === game.epoch) { updateEvalBar(); maybeFetchEval(); }
      }
    }

    $('eval-toggle').checked = evalOn;
    $('eval-toggle').addEventListener('change', e => {
      evalOn = e.target.checked;
      store('evalOn', evalOn ? '1' : '0');
      updateEvalBar();
      maybeFetchEval();
    });

    // ════════════════════════════════════════════════════════
    //  Playing moves
    // ════════════════════════════════════════════════════════
    function canMove() {
      return !game.busy && isLive() && !game.result && game.legal.length > 0 &&
        (gameMode === 'pvp' || game.turn === humanColorName);
    }

    function clearSelection() {
      selectedSquare = null;
      document.querySelectorAll('.sq.selected').forEach(sq => sq.classList.remove('selected'));
      document.querySelectorAll('.sq.legal').forEach(sq => sq.classList.remove('legal'));
      document.querySelectorAll('.sq.legal-capture').forEach(sq => sq.classList.remove('legal-capture'));
    }

    function selectSquare(sqId) {
      const dests = [...new Set(game.legal.filter(m => m.startsWith(sqId)).map(m => m.substring(2, 4)))];
      if (dests.length === 0) return false;
      selectedSquare = sqId;
      squareEl(sqId).classList.add('selected');
      dests.forEach(dest => {
        const el = squareEl(dest);
        if (el) el.classList.add(el.querySelector('.piece') ? 'legal-capture' : 'legal');
      });
      return true;
    }

    $('board').addEventListener('click', e => {
      const sqEl = e.target.closest('.sq');
      if (!sqEl || !canMove()) return;
      const sqId = sqEl.dataset.sq;

      if (!selectedSquare) {
        selectSquare(sqId);
        return;
      }
      if (selectedSquare === sqId) { clearSelection(); return; }

      const candidates = game.legal.filter(m => m.startsWith(selectedSquare + sqId));
      if (candidates.length === 1) {
        playHumanMove(candidates[0]);
      } else if (candidates.length > 1) {
        openPromotion(selectedSquare, sqId, candidates); // same squares, several promotion pieces
      } else {
        clearSelection();                 // an illegal square: dismiss, and allow picking another piece
        selectSquare(sqId);
      }
    });

    // ── Promotion picker ──
    const PROMO_NAMES = { q: 'Queen', r: 'Rook', b: 'Bishop', n: 'Knight' };

    function openPromotion(from, to, candidates) {
      const available = candidates.map(m => m[4]).filter(Boolean);
      const white = game.turn === 'White';
      const row = $('promo-row');
      row.innerHTML = '';
      for (const letter of ['q', 'r', 'b', 'n']) {
        if (!available.includes(letter)) continue;
        const button = document.createElement('button');
        button.type = 'button';
        button.title = PROMO_NAMES[letter];
        button.setAttribute('aria-label', PROMO_NAMES[letter]);
        const img = document.createElement('img');
        img.src = PIECE_IMAGES[white ? letter.toUpperCase() : letter];
        img.alt = PROMO_NAMES[letter];
        button.appendChild(img);
        button.addEventListener('click', ev => { ev.stopPropagation(); playHumanMove(from + to + letter); });
        row.appendChild(button);
      }
      $('promo').hidden = false;
    }

    function closePromotion() { $('promo').hidden = true; }
    $('promo').addEventListener('click', e => {
      if (e.target === $('promo')) { closePromotion(); clearSelection(); }
    });

    // Moves the piece on screen straight away; the server's reply redraws the real position.
    function animateOptimistic(uci) {
      const startEl = squareEl(uci.substring(0, 2));
      const targetEl = squareEl(uci.substring(2, 4));
      if (!startEl || !targetEl) return;
      const pieceImg = startEl.querySelector('.piece');
      if (pieceImg) {
        targetEl.querySelector('.piece')?.remove();
        targetEl.appendChild(pieceImg);
      }
      document.querySelectorAll('.sq.last-move').forEach(sq => sq.classList.remove('last-move'));
      startEl.classList.add('last-move');
      targetEl.classList.add('last-move');
    }

    function applyResponse(sent, r) {
      const followLive = isLive();

      if (sent.length > game.moves.length) {            // the human move is now part of the game
        game.moves.push(sent[sent.length - 1]);
        game.fens.push(r.cpuMove ? r.fenBeforeCpu : r.fen);
        game.evals.push(r.cpuMove ? r.eval : null);     // the engine scored the position it was asked about
      }
      if (r.cpuMove) {
        game.moves.push(r.cpuMove);
        game.fens.push(r.fen);
        game.evals.push(r.eval);
      }

      game.legal = r.legal;
      game.turn = r.turn;
      game.result = r.status === 'ONGOING' ? null : { type: r.status, loser: r.status === 'CHECKMATE' ? r.turn : null };
      game.busy = false;
      if (followLive) game.view = game.moves.length;
      render();
    }

    async function playHumanMove(uci) {
      if (!canMove()) return;
      closePromotion();
      clearSelection();
      animateOptimistic(uci);

      game.busy = true;
      updatePanels();
      updateNav();
      updateResignButton();

      const sent = game.moves.concat([uci]);
      const epoch = game.epoch;
      try {
        const r = await api(gameMode === 'pvp' ? 'PVP' : 'CPU', sent);
        if (epoch !== game.epoch) return;
        applyResponse(sent, r);
      } catch (err) {
        if (epoch !== game.epoch) return;
        game.busy = false;
        render();
        showBanner(err.message, { error: true, retry: () => playHumanMove(uci) });
      }
    }

    // ════════════════════════════════════════════════════════
    //  New game, resign, flip
    // ════════════════════════════════════════════════════════
    function disarmResign() {
      resignArmed = false;
      clearTimeout(resignTimer);
    }

    function canResign() { return !game.busy && !game.result && game.legal.length > 0; }

    function updateResignButton() {
      const btn = $('btn-resign');
      btn.classList.toggle('disabled', !canResign());
      btn.classList.toggle('armed', resignArmed);
      btn.textContent = resignArmed ? 'Confirm resign?' : 'Resign';
    }

    $('btn-resign').addEventListener('click', e => {
      e.preventDefault();
      if (!canResign()) return;
      if (!resignArmed) {                       // first click only arms the button
        resignArmed = true;
        resignTimer = setTimeout(() => { disarmResign(); updateResignButton(); }, 3000);
        updateResignButton();
        return;
      }
      disarmResign();
      const loser = gameMode === 'cpu' ? humanColorName : game.turn;
      game.result = { type: 'RESIGN', loser };
      game.legal = [];
      game.view = game.moves.length;
      closePromotion();
      render();
    });

    async function startGame() {
      game.epoch++;
      Object.assign(game, {
        moves: [], fens: [START_PLACEMENT], evals: [{ cp: 0 }], view: 0,
        legal: [], turn: 'White', result: null, busy: true
      });
      disarmResign();
      closePromotion();
      hideBanner();
      render();

      const epoch = game.epoch;
      try {
        // With no moves yet, the server returns the legal moves (and the engine's opening move if it plays White)
        const r = await api(gameMode === 'pvp' ? 'PVP' : 'CPU', []);
        if (epoch !== game.epoch) return;
        applyResponse([], r);
      } catch (err) {
        if (epoch !== game.epoch) return;
        game.busy = false;
        render();
        showBanner(err.message, { error: true, retry: startGame });
      }
    }

    $('btn-new').addEventListener('click', e => { e.preventDefault(); startGame(); });

    $('btn-flip').addEventListener('click', e => {
      e.preventDefault();
      flipped = !flipped;
      render();
    });

    // ── Init ──
    startGame();
  </script>
</body>

</html>
